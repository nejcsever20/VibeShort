<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VibeShort - Stories & Messaging</title>
  
  <link rel="stylesheet" href="styles/main.css">
  <link rel="stylesheet" href="styles/auth.css">
  <link rel="stylesheet" href="styles/stories.css">
  <link rel="stylesheet" href="styles/messaging.css">
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
</head>
<body>
  <!-- Header / Navigation -->
  <header class="app-header">
    <div class="header-left">
      <div class="logo"><i class="fa-solid fa-play-circle"></i> VibeShort</div>
      <div class="theme-toggle-container">
        <i class="fa-solid fa-sun"></i>
        <label class="switch">
          <input type="checkbox" id="theme-toggle-checkbox" checked>
          <span class="slider round"></span>
        </label>
        <i class="fa-solid fa-moon"></i>
      </div>
    </div>
    <div class="header-right" id="header-user-section">
      <!-- Dynamic login/register OR profile menu -->
    </div>
  </header>

  <!-- Main Application Dashboard -->
  <main class="app-container" id="app-content">
    <!-- Content injected dynamically based on auth status -->
  </main>

  <!-- MODALS -->
  
  <!-- Auth Modal (Login / Register) -->
  <div class="modal" id="auth-modal">
    <div class="modal-content auth-card">
      <span class="close-modal-btn" onclick="Auth.closeModal()">&times;</span>
      <div class="auth-tabs">
        <button class="auth-tab-btn active" id="tab-login" onclick="Auth.switchTab('login')">Login</button>
        <button class="auth-tab-btn" id="tab-register" onclick="Auth.switchTab('register')">Register</button>
      </div>

      <form id="login-form" onsubmit="Auth.handleLogin(event)">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" required placeholder="your@email.com">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary full-width">Sign In</button>
      </form>

      <form id="register-form" class="hidden" onsubmit="Auth.handleRegister(event)">
        <div class="form-group">
          <label for="reg-email">Email Address</label>
          <input type="email" id="reg-email" required placeholder="your@email.com">
        </div>
        <div class="form-group">
          <label for="reg-password">Password</label>
          <input type="password" id="reg-password" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn btn-primary full-width">Create Account</button>
      </form>
    </div>
  </div>

  <!-- Email Confirmation Modal -->
  <div class="modal" id="confirm-email-modal">
    <div class="modal-content text-center">
      <i class="fa-solid fa-envelope-circle-check auth-icon"></i>
      <h2>Confirm Your Email</h2>
      <p>We've sent a confirmation verification step to <strong id="confirm-target-email"></strong>.</p>
      <p class="text-muted text-sm mb-4">Click below to simulate email confirmation.</p>
      <button class="btn btn-success full-width" onclick="Auth.confirmEmailStep()">Confirm Account Now</button>
    </div>
  </div>

  <!-- Setup Display Name Onboarding Modal -->
  <div class="modal" id="onboarding-modal">
    <div class="modal-content">
      <h2>Welcome to VibeShort!</h2>
      <p class="text-muted mb-4">Choose your unique display name to get started.</p>
      <form onsubmit="Auth.saveDisplayName(event)">
        <div class="form-group">
          <label for="setup-display-name">Display Name</label>
          <input type="text" id="setup-display-name" required placeholder="e.g. Alex Rivera">
        </div>
        <button type="submit" class="btn btn-primary full-width">Save & Continue</button>
      </form>
    </div>
  </div>

  <!-- Create Story Modal -->
  <div class="modal" id="create-story-modal">
    <div class="modal-content">
      <span class="close-modal-btn" onclick="Stories.closeCreateModal()">&times;</span>
      <h3>Create New Story</h3>
      <form onsubmit="Stories.publishStory(event)">
        <div class="form-group">
          <label for="story-caption">Caption</label>
          <textarea id="story-caption" rows="3" placeholder="What's on your mind?"></textarea>
        </div>
        <div class="form-group">
          <label for="story-bg">Background Color</label>
          <input type="color" id="story-bg" value="#6366f1">
        </div>
        <div class="form-group">
          <label for="story-audience">Audience Privacy</label>
          <select id="story-audience">
            <option value="EVERYONE">Everyone (Followers & Friends)</option>
            <option value="FRIENDS_ONLY">Friends & Close Friends Only</option>
            <option value="CLOSE_FRIENDS">Close Friends Only</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary full-width">Share Story</button>
      </form>
    </div>
  </div>

  <!-- Story Full Screen Viewer Modal -->
  <div class="modal full-screen-modal" id="story-viewer-modal">
    <div class="story-viewer-container" id="story-viewer-content">
      <!-- Fullscreen Story Player content injected dynamically -->
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/state.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/stories.js"></script>
  <script src="js/messaging.js"></script>
  <script src="js/friends.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      State.initDB().then(() => {
        Auth.initTheme();
        Auth.checkSession();
      });

        window.env = {};
        async function loadEnv() {
            try {
            const response = await fetch('/.env');
            if (!response.ok) return;
            const text = await response.text();
            text.split('\n').forEach(line => {
                const [key, ...valueParts] = line.split('=');
                if (key && valueParts.length > 0) {
                window.env[key.trim()] = valueParts.join('=').trim();
                }
            });
            } catch (err) {
            console.warn('Could not load .env file:', err);
            }
        }
        loadEnv();
    });
  </script>
</body>
</html>
